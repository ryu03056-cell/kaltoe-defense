<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>칼퇴 디펜스</title>
<style>
:root{--bg:#101216;--panel:#1a1d24;--panel2:#252a34;--line:#2e333e;--text:#eef1f6;--muted:#8b93a5;--accent:#ffb020;--danger:#ff5d5d;--ok:#40d987}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100vw,540px);margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px}
#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 4px 5px;text-align:center;min-width:0}
.st .l{display:block;font-size:10px;color:var(--muted)}
.st b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#stage{position:relative;width:min(100%,calc((100vh - 236px)*0.794));aspect-ratio:540/680;margin:0 auto}
#cv{width:100%;height:100%;display:block;border-radius:12px;background:#15181e}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:6px 12px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,11,14,.86);border-radius:12px;padding:20px}
#overlay[hidden]{display:none}
.card{max-width:400px;text-align:center}
.card h1{font-size:32px;color:var(--accent);margin-bottom:4px}
.card h2{font-size:24px;margin-bottom:6px}
.card p.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card ul{text-align:left;font-size:13px;line-height:1.6;color:#cfd4de;margin:0 0 16px 18px}
.card .go{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700;font-size:17px;padding:10px 26px}
#panel{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:48px}
#selInfo{flex:1;font-size:12px;line-height:1.4;color:var(--muted);min-width:0}
#selInfo b{color:var(--text)}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
button:disabled{opacity:.38;cursor:default}
button:not(:disabled):active{transform:translateY(1px)}
#selBtns button{padding:7px 10px;font-size:13px}
#bMerge:not(:disabled){background:#3a2f12;border-color:var(--accent);color:var(--accent)}
#ctrl{display:grid;grid-template-columns:2fr 1.3fr .6fr .6fr;gap:6px}
#bSummon{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700;font-size:16px}
#bSummon small{font-weight:600;font-size:12px}
#luck{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#luck[hidden]{display:none}
.lk{font-size:12px;line-height:1.35}
.hint{font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="st"><span class="l">웨이브</span><b id="hWave">0/30</b></div>
    <div class="st"><span class="l">남은 시간</span><b id="hTime">-</b></div>
    <div class="st"><span class="l">쌓인 업무</span><b id="hCount">0/100</b><div class="bar"><i id="hBar"></i></div></div>
    <div class="st"><span class="l">골드</span><b id="hGold">💰0</b></div>
    <div class="st"><span class="l">커피</span><b id="hCoffee">☕0</b></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="overlay"></div>
  </div>
  <div id="panel">
    <div id="selInfo">칸을 눌러 직원을 선택하세요</div>
    <div id="selBtns"><button id="bMerge" disabled>합성</button> <button id="bSell" disabled>퇴사</button></div>
  </div>
  <div id="ctrl">
    <button id="bSummon">채용 <small id="sCost">💰20</small></button>
    <button id="bLuck">인맥 찬스 ☕</button>
    <button id="bSpeed">x1</button>
    <button id="bPause">⏸</button>
  </div>
  <div id="luck" hidden></div>
  <div class="hint">PC 단축키: Q 채용 · W 합성 · E 퇴사 · Esc 선택 해제</div>
</div>
<script>
(()=>{'use strict';
// ===================== 설정 (밸런스는 여기서 조정) =====================
const CFG={
  waves:30, maxEnemies:100, waveTime:20, bossTime:60, spawnWindow:12,
  startGold:100, summonBase:20, summonStep:1, startCoffee:2,
  summonOdds:[0.72,0.24,0.04],          // 채용 시 인턴/대리/과장 확률
  sellValue:[8,25,70,180],              // 퇴사 시 환급 골드(직급별)
  mergeSameJob:false,                   // true로 바꾸면 합성 시 같은 직업 유지(승진), false면 랜덤(이직)
  baseHp:30, hpGrowth:1.15, enemySpeed:65,
  waveCount:w=>16+Math.floor(w*0.8),
  waveBonus:w=>10+w*2,
  bossHpMul:[20,22,18],                 // 10/20/30웨이브 보스 체력 배율
};
const GRADES=[
  {name:'인턴',color:'#a3abb9',mult:1},
  {name:'대리',color:'#4aa3ff',mult:3.5},
  {name:'과장',color:'#b875ff',mult:12},
  {name:'부장',color:'#ff9a2e',mult:40},
];
const JOBS=[
  {name:'의사',icon:'🩺',dmg:9, cd:0.45,range:165,col:'#7fe0ff',desc:'빠른 연타'},
  {name:'변호사',icon:'⚖️',dmg:16,cd:1.0, range:175,col:'#ffe066',desc:'15% 확률 기절 "이의 있음!"',stun:{p:0.15,t:0.7}},
  {name:'건축가',icon:'📐',dmg:13,cd:1.2, range:165,col:'#ffa94d',desc:'범위 공격',splash:55},
  {name:'회계사',icon:'🧮',dmg:10,cd:0.8, range:165,col:'#69db7c',desc:'공격 시 12% 확률 골드 획득',gold:{p:0.12,v:1}},
  {name:'개발자',icon:'💻',dmg:8, cd:0.8, range:185,col:'#b197fc',desc:'둔화 "로딩 중..."',slow:{v:0.35,t:1.5}},
];
const ETYPES={
  task:  {icon:'📄',hp:1,  spd:1,  gold:1,size:20},
  urgent:{icon:'⚡',hp:0.6,spd:1.7,gold:1,size:19},
  client:{icon:'😡',hp:2.6,spd:0.8,gold:3,size:24},
};
const QUOTES={
  task:['긴급!!!','회신 요망','Re:Re:Re: 최종_진짜최종.hwp','금일 중 회신 바랍니다','첨부파일 확인 부탁','엑셀 좀 정리해줘'],
  urgent:['ASAP!!','10분 안에요','지금 바로요','5분이면 되죠?'],
  client:['그냥 대충 해주세요','이거 간단한 거죠?','견적이 왜 이렇게 비싸요?','무료로는 안 돼요?','제 친구는 5분이면 한대요','처음 시안이 제일 낫네요','카톡 보셨죠? (새벽 2시)','느낌 아시죠? 그 느낌'],
};
const BOSSES=[
  {name:'김부장',icon:'👔',quotes:['이거 오늘까지 되지?','내가 신입 땐 말이야~','회의 하나만 더 하자','퇴근? 벌써?']},
  {name:'갑 클라이언트',icon:'🤑',quotes:['예산은 없는데 퀄리티는 최고로요','로고 크게, 근데 작게요','계약서엔 없지만 해주실 거죠?','다른 데는 반값이던데?']},
  {name:'회장님',icon:'👑',quotes:['주말에 등산 갈 사람?','요즘 애들은 열정이 없어','회식은 2차부터지','다 너희 잘되라고~']},
];
const LUCK=[{g:1,cost:1,p:0.6},{g:2,cost:1,p:0.2},{g:3,cost:2,p:0.08}];

// ===================== 기하 =====================
const W=540,H=680;
const P={l:34,t:34,r:506,b:646}, PW=P.r-P.l, PH=P.b-P.t, PERIM=2*(PW+PH);
const COLS=3,ROWS=6,NC=COLS*ROWS,CW=124,CH=83,GX=78,GY=78,GAP=6;
const EMOJI='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const FONT='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const STATS=JOBS.map(j=>GRADES.map((g,gi)=>({dmg:j.dmg*g.mult,cd:j.cd*(1-0.06*gi),range:j.range+gi*12})));
const SLOTS=[[[0,-8]],[[-26,-8],[26,-8]],[[-36,-2],[0,-16],[36,-2]]];
const rnd=Math.random, pick=a=>a[(rnd()*a.length)|0];

function posAt(s){
  s=((s%PERIM)+PERIM)%PERIM;
  if(s<PW) return [P.l+s,P.t]; s-=PW;
  if(s<PH) return [P.r,P.t+s]; s-=PH;
  if(s<PW) return [P.r-s,P.b]; s-=PW;
  return [P.l,P.b-s];
}
function cellRect(i){const c=i%COLS,r=(i/COLS)|0;return {x:GX+c*(CW+GAP),y:GY+r*(CH+GAP),w:CW,h:CH};}
function cellCenter(i){const r=cellRect(i);return [r.x+r.w/2,r.y+r.h/2];}
function slotPos(i,k,n){const [cx,cy]=cellCenter(i),o=SLOTS[n-1][k];return [cx+o[0],cy+o[1]];}
const unitName=(j,g)=>`${GRADES[g].name} ${JOBS[j].name}`;

// ===================== 상태 =====================
let S, speed=1;
function reset(){
  S={t:0,wave:0,waveTimer:0,spawnQ:[],spawnT:0,spawnInterval:1,enemies:[],cells:new Array(NC).fill(null),
     gold:CFG.startGold,coffee:CFG.startCoffee,summons:0,sel:-1,fx:[],texts:[],state:'ready',paused:false,
     boss:null,bubbleT:2,kills:0,banner:null,dead:false,lastStunTxt:-9,lastGoldTxt:-9};
}
function start(){reset();S.state='play';startWave();hideOverlay();}

function startWave(){
  S.wave++;
  const w=S.wave, isBoss=w%10===0;
  if(w>1){addGold(CFG.waveBonus(w));}
  if(w>1&&(w-1)%5===0){S.coffee++;}
  S.waveTimer=isBoss?CFG.bossTime:CFG.waveTime;
  const hp=CFG.baseHp*Math.pow(CFG.hpGrowth,w-1);
  S.spawnQ=[];
  if(isBoss){
    const b=BOSSES[w/10-1];
    S.spawnQ.push({type:'boss',boss:b,hp:hp*CFG.bossHpMul[w/10-1]});
    banner(`${b.name} 등장!`,`${CFG.bossTime}초 안에 처치하지 못하면 패배`);
  }else{
    const n=CFG.waveCount(w);
    const pc=w>=5?Math.min(0.3,0.04+w*0.01):0, pu=w>=3?Math.min(0.3,0.08+w*0.008):0;
    for(let i=0;i<n;i++){const r=rnd();const type=r<pc?'client':r<pc+pu?'urgent':'task';S.spawnQ.push({type,hp:hp*ETYPES[type].hp});}
    if(w===1)banner('출근 완료','몰려오는 업무를 처리하세요');
  }
  S.spawnInterval=CFG.spawnWindow/Math.max(1,S.spawnQ.length);
  S.spawnT=0;
}
function spawn(q){
  const e={type:q.type,s:0,x:P.l,y:P.t,hp:q.hp,maxHp:q.hp,stunT:0,slowT:0,slowV:0,say:null};
  if(q.type==='boss'){
    const b=q.boss;
    Object.assign(e,{boss:true,name:b.name,icon:b.icon,size:40,spd:CFG.enemySpeed*0.55,gold:30,quotes:b.quotes});
    e.say={txt:pick(b.quotes),t:3};S.boss=e;
  }else{
    const T=ETYPES[q.type];
    Object.assign(e,{icon:T.icon,size:T.size,spd:CFG.enemySpeed*T.spd,gold:T.gold,quotes:QUOTES[q.type]});
  }
  S.enemies.push(e);
}

// ===================== 전투 =====================
function addGold(v){S.gold+=v;}
function fx(o){if(S.fx.length<400){o.max=o.life;S.fx.push(o);}}
function text(x,y,txt,col){if(S.texts.length<60)S.texts.push({x,y,txt,col,life:0.9,max:0.9});}
function banner(txt,sub){S.banner={txt,sub,t:2.4};}

function nearest(x,y,r){
  let best=null,bd=r*r;
  for(const e of S.enemies){if(e.hp<=0)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<=bd){bd=d;best=e;}}
  return best;
}
function hit(e,d){
  if(e.hp<=0)return;
  e.hp-=d;
  if(e.hp>0)return;
  S.dead=true;S.kills++;addGold(e.gold);
  if(e.boss){
    S.boss=null;S.coffee+=3;text(e.x,e.y,'☕+3','#ffd27a');
    if(S.wave>=CFG.waves){win();return;}
    banner(`${e.name} 퇴근!`,'커피 ☕+3 · 3초 뒤 다음 업무');
    S.waveTimer=Math.min(S.waveTimer,3);
  }
}
function attack(c,i,k,st,t){
  const job=JOBS[c.job];
  const [ux,uy]=slotPos(i,k,c.count);
  fx({k:'line',x1:ux,y1:uy,x2:t.x,y2:t.y,col:job.col,life:0.08});
  if(job.splash){
    const r=job.splash+c.grade*8,r2=r*r,tx=t.x,ty=t.y;
    for(const e of S.enemies){if(e.hp<=0)continue;const dx=e.x-tx,dy=e.y-ty;if(dx*dx+dy*dy<=r2)hit(e,st.dmg);}
    fx({k:'ring',x:tx,y:ty,r,col:job.col,life:0.25});
  }else hit(t,st.dmg);
  if(t.hp>0){
    if(job.stun&&rnd()<job.stun.p){
      t.stunT=Math.max(t.stunT,job.stun.t*(t.boss?0.35:1));
      if(S.t-S.lastStunTxt>1.2){S.lastStunTxt=S.t;text(t.x,t.y-24,'이의 있음!','#ffe066');}
    }
    if(job.slow){
      const v=(job.slow.v+c.grade*0.04)*(t.boss?0.5:1);
      if(t.slowT<=0||v>t.slowV)t.slowV=v;
      t.slowT=Math.max(t.slowT,job.slow.t);
    }
  }
  if(job.gold&&rnd()<job.gold.p){
    const v=job.gold.v+c.grade;addGold(v);
    if(S.t-S.lastGoldTxt>0.4){S.lastGoldTxt=S.t;text(ux,uy-22,'+'+v+'💰','#ffd27a');}
  }
}

function update(dt){
  if(S.state!=='play'||S.paused)return;
  S.t+=dt;
  if(S.spawnQ.length){
    S.spawnT-=dt;
    while(S.spawnT<=0&&S.spawnQ.length){spawn(S.spawnQ.shift());S.spawnT+=S.spawnInterval;}
  }
  for(const e of S.enemies){
    if(e.stunT>0)e.stunT-=dt;
    else{let sp=e.spd;if(e.slowT>0){e.slowT-=dt;sp*=1-e.slowV;}e.s+=sp*dt;}
    const p=posAt(e.s);e.x=p[0];e.y=p[1];
    if(e.say){e.say.t-=dt;if(e.say.t<=0)e.say=null;}
  }
  S.bubbleT-=dt;
  if(S.bubbleT<=0){
    S.bubbleT=1.6+rnd()*1.4;
    if(S.boss&&!S.boss.say&&rnd()<0.6)S.boss.say={txt:pick(S.boss.quotes),t:2.6};
    else{const pool=S.enemies.filter(e=>!e.say&&!e.boss);if(pool.length){const e=pick(pool);e.say={txt:pick(e.quotes),t:2.2};}}
  }
  for(let i=0;i<NC;i++){
    const c=S.cells[i];if(!c)continue;
    const st=STATS[c.job][c.grade];const [cx,cy]=cellCenter(i);
    for(let k=0;k<c.count;k++){
      if(c.cd[k]>0){c.cd[k]-=dt;if(c.cd[k]>0)continue;}
      const t=nearest(cx,cy,st.range);
      if(!t){c.cd[k]=0;continue;}
      c.cd[k]+=st.cd;attack(c,i,k,st,t);
      if(S.state!=='play')return;
    }
  }
  if(S.dead){S.enemies=S.enemies.filter(e=>e.hp>0);S.dead=false;}
  S.waveTimer-=dt;
  if(S.waveTimer<=0){
    if(S.boss){lose(`${S.boss.name}에게 찍혔습니다`,'제한 시간 안에 상사를 처치하지 못했어요');return;}
    startWave();
  }
  if(S.enemies.length>=CFG.maxEnemies){lose('업무 과부하','처리 못 한 일이 100건 쌓였어요');return;}
  for(const f of S.fx)f.life-=dt;
  S.fx=S.fx.filter(f=>f.life>0);
  for(const t of S.texts){t.life-=dt;t.y-=22*dt;}
  S.texts=S.texts.filter(t=>t.life>0);
  if(S.banner){S.banner.t-=dt;if(S.banner.t<=0)S.banner=null;}
}

// ===================== 직원 관리 =====================
function findSlot(j,g){
  for(let i=0;i<NC;i++){const c=S.cells[i];if(c&&c.job===j&&c.grade===g&&c.count<3)return i;}
  for(let i=0;i<NC;i++)if(!S.cells[i])return i;
  return -1;
}
function addUnit(j,g){
  const i=findSlot(j,g);if(i<0)return -1;
  const c=S.cells[i];
  if(c){c.count++;c.cd.push(rnd()*0.3);}
  else S.cells[i]={job:j,grade:g,count:1,cd:[rnd()*0.3]};
  const [cx,cy]=cellCenter(i);fx({k:'pop',x:cx,y:cy,col:GRADES[g].color,life:0.35});
  return i;
}
function rollGrade(){let r=rnd(),a=0;for(let g=0;g<CFG.summonOdds.length;g++){a+=CFG.summonOdds[g];if(r<a)return g;}return 0;}
const summonCost=()=>CFG.summonBase+S.summons*CFG.summonStep;
function summon(){
  if(S.state!=='play')return false;
  const cost=summonCost();
  if(S.gold<cost){toast('골드가 부족합니다');return false;}
  const g=rollGrade(),j=(rnd()*JOBS.length)|0;
  if(findSlot(j,g)<0){toast('자리가 없습니다 — 합성하거나 퇴사시키세요');return false;}
  S.gold-=cost;S.summons++;addUnit(j,g);
  toast(`${unitName(j,g)} 입사${g>=2?' ✨':''}`);
  return true;
}
function merge(i){
  const c=S.cells[i];
  if(S.state!=='play'||!c||c.count<3)return false;
  if(c.grade>=GRADES.length-1){toast('부장은 더 이상 합성할 수 없습니다 (신화 레시피 준비 중)');return false;}
  S.cells[i]=null;
  const ng=c.grade+1,nj=CFG.mergeSameJob?c.job:(rnd()*JOBS.length)|0;
  const ni=addUnit(nj,ng);
  toast(`${unitName(c.job,c.grade)}×3 → ${unitName(nj,ng)} ${nj===c.job?'(승진!)':'(이직!)'}`);
  S.sel=ni;return true;
}
function sell(i){
  const c=S.cells[i];if(S.state!=='play'||!c)return false;
  const v=CFG.sellValue[c.grade];addGold(v);
  toast(`${unitName(c.job,c.grade)} 퇴사 · 💰+${v}`);
  c.count--;c.cd.pop();
  if(c.count<=0){S.cells[i]=null;S.sel=-1;}
  return true;
}
function gamble(k){
  const o=LUCK[k];if(S.state!=='play')return false;
  if(S.coffee<o.cost){toast('커피가 부족합니다');return false;}
  const j=(rnd()*JOBS.length)|0;
  if(findSlot(j,o.g)<0){toast('자리가 없습니다');return false;}
  S.coffee-=o.cost;
  if(rnd()<o.p){addUnit(j,o.g);toast(`인맥으로 ${unitName(j,o.g)} 영입 성공! ✨`);return true;}
  toast(pick(['읽씹 당했습니다…','"다음에 밥 한번 먹자"…','연락이 끊겼습니다','이미 다른 회사로 갔대요']));
  return false;
}

// ===================== 렌더 =====================
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;}
resize();window.addEventListener('resize',resize);

function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function emoji(ch,x,y,size){ctx.fillStyle='#ffffff';ctx.font=`${size}px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y);}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#15181e';ctx.fillRect(0,0,W,H);
  // 복도(경로)
  ctx.lineJoin='round';ctx.strokeStyle='#222733';ctx.lineWidth=44;ctx.strokeRect(P.l,P.t,PW,PH);
  ctx.strokeStyle='#2f3542';ctx.lineWidth=1;ctx.setLineDash([10,12]);ctx.strokeRect(P.l,P.t,PW,PH);ctx.setLineDash([]);
  ctx.fillStyle='#4a5162';ctx.font=`bold 11px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('입구 ▶',P.l+16,P.t);
  // 그리드
  const pulse=0.5+0.5*Math.sin(performance.now()/180);
  for(let i=0;i<NC;i++){
    const r=cellRect(i),c=S.cells[i];
    rrect(r.x,r.y,r.w,r.h,10);
    if(c){const gc=GRADES[c.grade].color;ctx.fillStyle=hexA(gc,0.13);ctx.fill();ctx.strokeStyle=hexA(gc,0.75);ctx.lineWidth=1.5;ctx.stroke();}
    else{ctx.fillStyle='#1b1f27';ctx.fill();ctx.strokeStyle='#262b35';ctx.lineWidth=1;ctx.stroke();}
    if(c&&c.count===3&&c.grade<GRADES.length-1){
      rrect(r.x-1,r.y-1,r.w+2,r.h+2,11);ctx.strokeStyle=hexA('#ffb020',0.35+0.55*pulse);ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle='#ffb020';ctx.font=`bold 10px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('합성 가능',r.x+r.w-6,r.y+5);
    }
    if(i===S.sel){rrect(r.x-2,r.y-2,r.w+4,r.h+4,12);ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();}
    if(c){
      for(let k=0;k<c.count;k++){const [x,y]=slotPos(i,k,c.count);emoji(JOBS[c.job].icon,x,y,c.grade>=2?30:27);}
      ctx.fillStyle=GRADES[c.grade].color;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(`${unitName(c.job,c.grade)}${c.count>1?' ×'+c.count:''}`,r.x+r.w/2,r.y+r.h-11);
    }
  }
  if(S.sel>=0&&S.cells[S.sel]){
    const c=S.cells[S.sel],[cx,cy]=cellCenter(S.sel);
    ctx.beginPath();ctx.arc(cx,cy,STATS[c.job][c.grade].range,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
  }
  // 적
  for(const e of S.enemies){if(!e.boss)drawEnemy(e);}
  if(S.boss)drawEnemy(S.boss);
  // 이펙트
  for(const f of S.fx){
    const a=f.life/f.max;
    if(f.k==='line'){ctx.strokeStyle=hexA(f.col,a);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();}
    else if(f.k==='ring'){ctx.strokeStyle=hexA(f.col,a*0.8);ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.1-a*0.3),0,Math.PI*2);ctx.stroke();}
    else if(f.k==='pop'){ctx.strokeStyle=hexA(f.col,a);ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,20+(1-a)*40,0,Math.PI*2);ctx.stroke();}
  }
  for(const t of S.texts){ctx.globalAlpha=Math.min(1,t.life/t.max*1.5);ctx.fillStyle=t.col;ctx.font=`bold 13px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.txt,t.x,t.y);}
  ctx.globalAlpha=1;
  for(const e of S.enemies)if(e.say)drawBubble(e);
  // 보스 체력바
  if(S.boss){
    const b=S.boss,x=GX,w=COLS*CW+(COLS-1)*GAP,y=60;
    ctx.fillStyle='#2a1416';rrect(x,y,w,12,6);ctx.fill();
    ctx.fillStyle='#ff5d5d';rrect(x,y,Math.max(0,w*b.hp/b.maxHp),12,6);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 10px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`${b.name}  ${Math.ceil(b.hp).toLocaleString()} / ${Math.ceil(b.maxHp).toLocaleString()}`,x+w/2,y+6.5);
  }
  if(S.banner){
    const a=Math.min(1,S.banner.t/0.4);
    ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(60,H/2-44,W-120,88);
    ctx.fillStyle='#ffb020';ctx.font=`bold 26px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(S.banner.txt,W/2,H/2-12);
    ctx.fillStyle='#cfd4de';ctx.font=`13px ${FONT}`;ctx.fillText(S.banner.sub,W/2,H/2+18);
    ctx.globalAlpha=1;
  }
}
function drawEnemy(e){
  if(e.slowT>0){ctx.fillStyle='rgba(177,151,252,0.28)';ctx.beginPath();ctx.arc(e.x,e.y,e.size*0.7,0,Math.PI*2);ctx.fill();}
  emoji(e.icon,e.x,e.y,e.size);
  if(e.stunT>0)emoji('💫',e.x+e.size*0.45,e.y-e.size*0.55,12);
  if(!e.boss&&e.hp<e.maxHp){
    const w=e.size*1.1,x=e.x-w/2,y=e.y-e.size*0.7-4;
    ctx.fillStyle='#3a1d20';ctx.fillRect(x,y,w,3);ctx.fillStyle='#ff6b6b';ctx.fillRect(x,y,w*Math.max(0,e.hp/e.maxHp),3);
  }
}
function drawBubble(e){
  ctx.font=`12px ${FONT}`;
  const tw=ctx.measureText(e.say.txt).width,w=tw+14,h=22;
  let x=e.x-w/2,y=e.y-e.size*0.6-h-8;
  x=Math.max(4,Math.min(W-w-4,x));if(y<4)y=e.y+e.size*0.6+8;
  ctx.globalAlpha=Math.min(1,e.say.t/0.3);
  ctx.fillStyle=e.boss?'#ffe3e3':'#ffffff';rrect(x,y,w,h,8);ctx.fill();
  ctx.fillStyle='#1b1d22';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.say.txt,x+w/2,y+h/2+1);
  ctx.globalAlpha=1;
}

// ===================== UI =====================
const $=id=>document.getElementById(id);
const UI={wave:$('hWave'),time:$('hTime'),count:$('hCount'),bar:$('hBar'),gold:$('hGold'),coffee:$('hCoffee'),
  sel:$('selInfo'),merge:$('bMerge'),sell:$('bSell'),summon:$('bSummon'),cost:$('sCost'),luck:$('bLuck'),luckBox:$('luck'),
  speed:$('bSpeed'),pause:$('bPause'),overlay:$('overlay'),toast:$('toast')};
const cache={};
function setT(k,el,v){if(cache[k]!==v){cache[k]=v;el.textContent=v;}}
function setH(k,el,v){if(cache[k]!==v){cache[k]=v;el.innerHTML=v;}}
function setD(k,el,v){if(cache[k]!==v){cache[k]=v;el.disabled=v;}}
let toastTimer=0;
function toast(m){UI.toast.textContent=m;UI.toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>UI.toast.classList.remove('on'),1600);}

UI.luckBox.innerHTML=LUCK.map((o,k)=>`<button class="lk" data-k="${k}">${GRADES[o.g].name} 영입 시도<br>☕${o.cost} · 성공 ${Math.round(o.p*100)}%</button>`).join('');
UI.luckBox.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)gamble(+b.dataset.k);});

function updateUI(){
  const play=S.state==='play';
  setT('w',UI.wave,`${S.wave}/${CFG.waves}`);
  setT('t',UI.time,play?`${Math.max(0,Math.ceil(S.waveTimer))}s`:'-');
  UI.time.style.color=S.boss?'var(--danger)':'';
  const n=S.enemies.length;
  setT('n',UI.count,`${n}/${CFG.maxEnemies}`);
  const pct=Math.min(100,n/CFG.maxEnemies*100);
  if(cache.pct!==pct){cache.pct=pct;UI.bar.style.width=pct+'%';UI.bar.style.background=pct>=70?'var(--danger)':pct>=40?'var(--accent)':'var(--ok)';}
  setT('g',UI.gold,'💰'+S.gold);
  setT('c',UI.coffee,'☕'+S.coffee);
  const cost=summonCost();
  setT('cost',UI.cost,'💰'+cost);
  setD('sum',UI.summon,!play||S.gold<cost);
  const c=S.sel>=0?S.cells[S.sel]:null;
  if(c){
    const st=STATS[c.job][c.grade],j=JOBS[c.job];
    setH('sel',UI.sel,`<b>${j.icon} ${unitName(c.job,c.grade)} ×${c.count}</b><br>공격력 ${Math.round(st.dmg)} · 공속 ${st.cd.toFixed(2)}초 · 사거리 ${st.range} · ${j.desc}`);
  }else setH('sel',UI.sel,'칸을 눌러 직원을 선택하세요');
  setD('mg',UI.merge,!play||!c||c.count<3||c.grade>=GRADES.length-1);
  setD('sl',UI.sell,!play||!c);
  setT('sellT',UI.sell,c?`퇴사 +${CFG.sellValue[c.grade]}`:'퇴사');
  setT('pz',UI.pause,S.paused?'▶':'⏸');
}

cv.addEventListener('pointerdown',ev=>{
  const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height;
  let hi=-1;
  for(let i=0;i<NC;i++){const c=cellRect(i);if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){hi=i;break;}}
  S.sel=(hi>=0&&S.cells[hi]&&S.sel!==hi)?hi:-1;
});
UI.summon.onclick=()=>summon();
UI.merge.onclick=()=>{if(S.sel>=0)merge(S.sel);};
UI.sell.onclick=()=>{if(S.sel>=0)sell(S.sel);};
UI.luck.onclick=()=>{UI.luckBox.hidden=!UI.luckBox.hidden;};
UI.speed.onclick=()=>{speed=speed>=3?1:speed+1;UI.speed.textContent='x'+speed;};
UI.pause.onclick=()=>{if(S.state==='play')S.paused=!S.paused;};
window.addEventListener('keydown',ev=>{
  const k=ev.key.toLowerCase();
  if(k==='q'||k==='ㅂ')summon();
  else if((k==='w'||k==='ㅈ')&&S.sel>=0)merge(S.sel);
  else if((k==='e'||k==='ㄷ')&&S.sel>=0)sell(S.sel);
  else if(k==='escape')S.sel=-1;
});

function showOverlay(kind,title,sub){
  const o=UI.overlay;o.hidden=false;
  if(kind==='start'){
    o.innerHTML=`<div class="card"><h1>칼퇴 디펜스</h1><p class="sub">진상 클라이언트와 상사를 막고 오늘은 칼퇴하자</p>
    <ul><li><b>채용</b>: 랜덤 직업·직급의 직원이 입사합니다</li>
    <li>같은 직원 <b>3명</b>이 모이면 <b>합성</b> → 한 단계 위 직급 (직업은 랜덤, 이직!)</li>
    <li>인턴 → 대리 → 과장 → 부장</li>
    <li>쌓인 업무가 <b>100건</b>이 되면 야근 확정</li>
    <li>10웨이브마다 <b>상사 보스</b> — ${CFG.bossTime}초 안에 처치</li>
    <li>보스를 잡으면 커피 ☕ → <b>인맥 찬스</b>로 고급 직원 영입</li></ul>
    <button class="go" id="goBtn">출근하기</button></div>`;
  }else{
    const won=kind==='win';
    o.innerHTML=`<div class="card"><h2>${won?'🎉 칼퇴 성공!':'😵 야근 확정…'}</h2>
    <p class="sub">${won?'회장님까지 퇴근시켰습니다':`${title} — ${sub}`}</p>
    <p class="sub">도달 웨이브 ${S.wave} · 처리한 업무 ${S.kills}건 · 채용 ${S.summons}명</p>
    <button class="go" id="goBtn">다시 출근</button></div>`;
  }
  $('goBtn').onclick=start;
}
function hideOverlay(){UI.overlay.hidden=true;UI.luckBox.hidden=true;}
function lose(t,sub){S.state='over';showOverlay('over',t,sub);}
function win(){S.state='win';showOverlay('win');}

// ===================== 루프 =====================
let last=performance.now();
const KT={paused:false};
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!KT.paused)for(let i=0;i<speed;i++)update(dt);
  render();updateUI();
  requestAnimationFrame(frame);
}
reset();showOverlay('start');
requestAnimationFrame(frame);

// 테스트·밸런스 조정용 핸들
Object.assign(KT,{CFG,GRADES,JOBS,start,update,summon,merge,sell,gamble,summonCost});
Object.defineProperty(KT,'S',{get:()=>S});
window.KT=KT;
})();
</script>
