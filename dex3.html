<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>칼퇴 디펜스 · 캐릭터 도감</title>
<style>
:root{--bg:#101216;--panel:#1a1d24;--panel2:#232730;--line:#2e333e;--text:#eef1f6;--muted:#8b93a5;--accent:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:20px 16px 40px}
header{max-width:1040px;margin:0 auto 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:24px;color:var(--accent)}
header p{color:var(--muted);font-size:13px}
header a{color:#8cc4ff;font-size:13px;text-decoration:none}
#grid{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.top canvas{width:120px;height:136px;border-radius:10px;flex:none}
.who h2{font-size:20px}
.who .title{font-size:13px;font-weight:700;margin-top:2px}
.who .meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 0 4px;cursor:pointer;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center}
.tabs button.on{border-color:currentColor}
.tabs canvas{width:40px;height:44px}
.bio{font-size:13px;line-height:1.6;color:#cfd4de}
.quotes{display:flex;flex-wrap:wrap;gap:6px}
.quotes span{background:#fff7d6;color:#2b2411;border-radius:10px;padding:4px 9px;font-size:12px;font-weight:700}
.skill{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;line-height:1.5}
.skill b{color:var(--text)}
</style>
</head>
<body>
<header>
  <div><h1>👥 캐릭터 도감</h1><p>직업마다 한 명의 주인공이 인턴부터 대표까지 성장합니다. 직급 버튼을 눌러보세요. · 캐릭터: PixelLab 생성</p></div>
  <a href="./">← 게임으로 돌아가기</a>
</header>
<div id="grid"></div>
<script src="characters3.js"></script>
<script src="characters4.js"></script>
<script src="characters6.js"></script>
<script src="profiles.js"></script>
<script>
(()=>{
const JOB=['의사','변호사','건축가','회계사','개발자'],GRADE=['인턴','대리','과장','부장','대표'];
const RANGE=[[140,'근거리'],[205,'중장거리'],[180,'중거리'],[170,'중거리'],[250,'원거리']];
const GC=KTChars.GRADECOL,grid=document.getElementById('grid'),cards=[];
KTProfiles.forEach((p,j)=>{
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="top"><canvas width="360" height="408"></canvas><div class="who"><h2>${p.name}</h2><div class="title"></div>
    <div class="meta">${JOB[j]} · ${p.gender} · ${p.mbti}<br>좋아함: ${p.like}<br>싫어함: ${p.dislike}</div></div></div>
    <div class="tabs">${GRADE.map((g,i)=>`<button data-g="${i}" style="color:${GC[i]}"><canvas width="120" height="132"></canvas>${g}</button>`).join('')}</div>
    <div class="quotes"></div><p class="bio">${p.bio}</p>
    <div class="skill"><b>사거리</b> ${RANGE[j][0]} (${RANGE[j][1]}) · <b>능력</b> ${p.skill}</div>`;
  grid.appendChild(el);
  const big=el.querySelector('.top canvas'),tabs=[...el.querySelectorAll('.tabs button')];
  const card={j,g:3,big,el,tabs};cards.push(card);
  const paintTabs=()=>tabs.forEach(b=>{const cv=b.querySelector('canvas'),x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);KTChars.portrait(x,j,+b.dataset.g,60,72,128,0);});
  tabs.forEach(b=>{b.onclick=()=>{card.g=+b.dataset.g;sel(card);};});paintTabs();if(KTChars.ready)KTChars.ready.then(paintTabs);
  sel(card);
});
function sel(c){
  const p=KTProfiles[c.j];
  c.tabs.forEach((b,i)=>b.classList.toggle('on',i===c.g));
  const t=c.el.querySelector('.title');t.textContent=`${p.titles[c.g]}${c.g===4?' ('+JOB[c.j]+' 대표)':''}`;t.style.color=GC[c.g];
  c.el.querySelector('.quotes').innerHTML=p.quotes[c.g].map(q=>`<span>"${q}"</span>`).join('');
}
function frame(now){
  const t=now/1000;
  for(const c of cards){const x=c.big.getContext('2d');x.clearRect(0,0,360,408);
    x.fillStyle=GC[c.g]+'22';x.fillRect(0,0,360,408);KTChars.portrait(x,c.j,c.g,180,222,370,t);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
